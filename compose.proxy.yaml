services:
  caddy:
    ports: !override
      - "${LG_BIND_HOST:-127.0.0.1}:${LG_HTTP_PORT:-80}:80"
    environment:
      LG_HTTPS_PUBLISHED: "false"
      LG_SCHEME: ${LG_SCHEME:-https}
      LG_TLS_ISSUER: none
      LG_LISTEN_SCHEME: http
  langfuse-web:
    environment: &public-origin
      NEXTAUTH_URL: ${LG_SCHEME:-https}://langfuse.${LG_PUBLIC_DOMAIN:-localhost}${LG_PUBLIC_PORT_SUFFIX:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LG_SCHEME:-https}://s3.${LG_PUBLIC_DOMAIN:-localhost}${LG_PUBLIC_PORT_SUFFIX:-}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LG_SCHEME:-https}://s3.${LG_PUBLIC_DOMAIN:-localhost}${LG_PUBLIC_PORT_SUFFIX:-}
  langfuse-worker:
    environment: *public-origin
  rustfs:
    environment:
      RUSTFS_CORS_ALLOWED_ORIGINS: ${LG_SCHEME:-https}://langfuse.${LG_PUBLIC_DOMAIN:-localhost}${LG_PUBLIC_PORT_SUFFIX:-}
